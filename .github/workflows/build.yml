name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        env:
          MR_KEYSTORE_BASE64: ${{ secrets.MR_KEYSTORE_BASE64 }}
          MR_KEYSTORE_PASSWORD: ${{ secrets.MR_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$MR_KEYSTORE_BASE64" ]; then
            echo "::error::Secret MR_KEYSTORE_BASE64 ausente. Sem ele o APK não atualiza o app instalado."
            exit 1
          fi
          echo "$MR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/minharotina.jks"
          export MR_KEYSTORE_FILE="$RUNNER_TEMP/minharotina.jks"
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MinhaRotina-apk
          path: app/build/outputs/apk/debug/app-debug.apk
